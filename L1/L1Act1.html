<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Syntax & Commenting Example</title>
  </head>

  <body>
    <!-- Placeholders for output -->
    <h1 id="myHeading"></h1>
    <p id="myParagraph"></p>

    <script>
    /*
      - How to use JavaScript comments
      - How to change HTML content using JavaScript
      - How to print messages to the console
    */

      // Set the heading text
      document.getElementById("myHeading").innerHTML =
        "JavaScript Syntax Guide & Commenting";

      // Set the paragraph text
      document.getElementById("myParagraph").innerHTML =
        "This paragraph was added using JavaScript.";

      // Log a message to the console (used for testing or debugging)
      console.log("✅ JavaScript is running successfully!");
    </script>
  </body>
</html>
