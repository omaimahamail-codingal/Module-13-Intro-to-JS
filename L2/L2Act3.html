<!DOCTYPE html>
<html>
  <head>
    <title>Function Expression</title>
  </head>

  <body>
    <center>
      <h1 style="color: blueviolet">Codingal</h1>
      <h3>Function Expression in JavaScript</h3>

      <p>
        In this activity, learn how to store a function expression in a variable
        and use it.
      </p>

      <script>
        /*
          In JavaScript, a function expression allows you to store
          a function inside a variable. You can then use that variable
          name to call the function later.
        */

        // Store a function expression in a variable named 'result'
        var result = function (a, b) {
          return a * b; // This function multiplies two numbers
        };

        // Call the function using the variable name and display the result
        document.write("The product of 8 and 10 is: " + result(8, 10));
      </script>
    </center>
  </body>
</html>
