<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Arrays</h2>
<p>In this activity, learn how to create an array and access its elements using indexes.</p>

<p id="demo"></p>

<script>
  // Create an array
  var coding = ["JavaScript", "HTML", "CSS"];

  // Accessing array elements (index starts from 0)
  var item1 = coding[0];
  var item2 = coding[1]; 
  var item3 = coding[2]; 

  // Show the accessed items
  document.getElementById("demo").innerHTML =
    "First item: " + item1 + "<br>" +
    "Second item: " + item2 + "<br>" +
    "Third item: " + item3 + "<br>" +
    "List: " + coding;
    </script>

</body>
</html>
