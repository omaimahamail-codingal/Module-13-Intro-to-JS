<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Arrays</h2>
    <h3>Array Methods: join() and pop()</h3>

    <p>The <b>join()</b> method joins all array elements into a single string.</p>
    <p>The <b>pop()</b> method removes the last element from the array.</p>

    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>

    <script>
      // Create an array
      var fruits = ["Banana", "Orange", "Apple", "Mango"];

      // join() → combines all elements into a string
      document.getElementById("myjoin").innerHTML =
        "Joined string: " + fruits.join(" - ");

      // Show array before pop()
      document.getElementById("myfirstpop").innerHTML =
        "Before pop(): " + fruits;

      // pop() → removes last item ("Mango")
      fruits.pop();

      // Show array after pop()
      document.getElementById("mysecondpop").innerHTML =
        "After pop(): " + fruits;
    </script>
  </body>
</html>
