<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Built-in Math Object Methods</title>
  </head>
  <body>
    <h2>JavaScript Math Object Methods</h2>
    <p>
      In this activity, learn how to use basic Math object methods in
      JavaScript.
    </p>

    <script type="text/javascript">
      // Math.acos(x) → returns the arccosine (in radians)
      var value1 = Math.acos(-1);
      document.write("Math.acos(-1) = " + value1 + "<br><br>");

      // Math.asin(x) → returns the arcsine (in radians)
      var value2 = Math.asin(1);
      document.write("Math.asin(1) = " + value2 + "<br><br>");

      // Math.atan(x) → returns the arctangent (in radians)
      var value3 = Math.atan(0.5);
      document.write("Math.atan(0.5) = " + value3 + "<br><br>");

      // Math.abs(x) → returns the absolute value (always positive)
      var value4 = Math.abs(-25);
      document.write("Math.abs(-25) = " + value4 + "<br><br>");

      // Math.sqrt(x) → returns the square root of a number
      var value5 = Math.sqrt(49);
      document.write("Math.sqrt(49) = " + value5 + "<br><br>");

      // Math.pow(x, y) → returns x raised to the power of y
      var value6 = Math.pow(5, 3);
      document.write("Math.pow(5, 3) = " + value6 + "<br><br>");

      // Math.round(x) → rounds a number to the nearest integer
      var value7 = Math.round(4.6);
      document.write("Math.round(4.6) = " + value7 + "<br><br>");
    </script>
  </body>
</html>
